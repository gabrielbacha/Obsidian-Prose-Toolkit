name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Attest main.js build provenance
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
          generate_release_notes: true
